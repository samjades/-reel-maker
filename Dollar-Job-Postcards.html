<title>Dollar Job Postcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: controls column on the left, sticky postcard preview on the right; preview moves first on phones. */
:root {
  --bg: #f6f4ec;
  --panel: #ffffff;
  --ink: #0e1f4d;
  --muted: #5b6585;
  --line: #dcd8c8;
  --green: #1d6b2f;
  --yellow: #ffd60a;
  --on-green: #ffffff;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Archivo Black", "Archivo", Impact, sans-serif;
  --font-script: "Caveat", "Segoe Script", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1224; --panel: #151b33; --ink: #eef0fa; --muted: #98a2c6; --line: #2a3358;
    --green: #3ea85a; --yellow: #ffd60a; --on-green: #0b1a10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1224; --panel: #151b33; --ink: #eef0fa; --muted: #98a2c6; --line: #2a3358;
  --green: #3ea85a; --yellow: #ffd60a; --on-green: #0b1a10; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
header h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 32px; margin-top: 24px; align-items: start; }
.controls { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.preview { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } .preview { order: -1; position: static; } }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend, .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-weight: 600; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.group-title { font-family: var(--font-display); font-size: 1rem; margin: 0 0 8px; }
.cat { display: flex; flex-direction: column; gap: 10px; }
.cat + .cat { margin-top: 14px; }
input[type=text], textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 64px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr); } }
.btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 11px 16px; border: 1.5px solid var(--ink); cursor: pointer; color: var(--ink); background: transparent; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn:hover { filter: brightness(1.08); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.stage { border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(10, 20, 60, .22); line-height: 0; }
canvas { width: 100%; height: auto; display: block; }
.note { font-size: 13px; color: var(--muted); margin: 0; min-height: 1.4em; }
.saved { display: none; }
.saved.on { display: block; }
.saved img { width: 100%; border-radius: 6px; display: block; }
.small-file { font-size: 13px; color: var(--muted); }
.small-file input { font-size: 13px; max-width: 100%; }
.cap { display: flex; flex-direction: column; gap: 10px; }
.cap textarea { min-height: 170px; line-height: 1.45; }
</style>

<div class="wrap">
  <header>
    <h1>Dollar Job Postcards</h1>
    <p>Pick a topic and a hook, tweak the words, and download a ready-to-post card with your photo, handle and watermark.</p>
  </header>

  <div class="grid">
    <div class="controls">
      <fieldset>
        <legend>Topic</legend>
        <div class="cat">
          <div>
            <p class="group-title">Insurance</p>
            <div class="chips" id="chips-ins"></div>
          </div>
          <div>
            <p class="group-title">Loans &amp; Mortgages</p>
            <div class="chips" id="chips-loan"></div>
          </div>
          <div>
            <label class="lbl" for="custom">Or your own topic</label>
            <input type="text" id="custom" placeholder="e.g. Home Insurance, Student Loans" autocomplete="off">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Hook type</legend>
        <div class="chips" id="chips-hook"></div>
      </fieldset>

      <div>
        <div class="actions" style="margin-bottom:12px">
          <button class="btn primary" id="shuffle" type="button">New idea for this hook</button>
        </div>
        <div class="row">
          <div>
            <label class="lbl" for="tag">Tag</label>
            <input type="text" id="tag" maxlength="22">
          </div>
          <div>
            <label class="lbl" for="size">Size</label>
            <select id="size">
              <option value="1080x1350">Portrait post 1080 × 1350</option>
              <option value="1080x1080">Square post 1080 × 1080</option>
              <option value="1080x1920">Story 1080 × 1920</option>
            </select>
          </div>
        </div>
        <label class="lbl" for="headline" style="margin-top:14px">Hook headline</label>
        <textarea id="headline" rows="3"></textarea>
        <label class="lbl" for="sub" style="margin-top:14px">Supporting line</label>
        <textarea id="sub" rows="3"></textarea>
        <div class="small-file" style="margin-top:14px">
          <label class="lbl" for="photo">Swap your photo (optional)</label>
          <input type="file" id="photo" accept="image/*">
        </div>
      </div>
    </div>

    <div class="preview">
      <div class="stage"><canvas id="card" width="1080" height="1350" aria-label="Postcard preview"></canvas></div>
      <div class="actions">
        <button class="btn primary" id="show" type="button">Download image</button>
        <button class="btn" id="copy" type="button">Copy image</button>
      </div>
      <p class="note" id="note" role="status"></p>
      <div class="saved" id="saved">
        <p class="note">Right-click the image and choose Save image, or press and hold on your phone.</p>
        <img id="out" alt="Finished postcard">
      </div>
      <div class="cap">
        <label class="lbl" for="caption">Caption and hashtags</label>
        <textarea id="caption" rows="8"></textarea>
        <div class="actions">
          <button class="btn primary" id="copycap" type="button">Copy caption</button>
          <button class="btn" id="recap" type="button">Rewrite caption</button>
        </div>
      </div>
    </div>
  </div>
</div>

      "Give your {l} a job this week"
    ]},
    shift: { label: "Before / after", tag: "Money shift", lines: [
      "Before: confused about {l}. After: in control.",
      "From guessing to knowing: {l}",
      "Stop guessing about {l}. Start comparing.",
      "Turn {l} from a worry into a plan"
    ]}
  };

  var state = { topic: "Auto Insurance", hook: "question", variant: 0, tipIdx: 0 };
  var els = {
    tag: document.getElementById("tag"), headline: document.getElementById("headline"), sub: document.getElementById("sub"),
    size: document.getElementById("size"), custom: document.getElementById("custom"), canvas: document.getElementById("card"),
    note: document.getElementById("note"), saved: document.getElementById("saved"), out: document.getElementById("out"),
    photo: document.getElementById("photo"), caption: document.getElementById("caption")
  };

  function fill(tpl, topic) { return tpl.replace(/\{t\}/g, topic).replace(/\{l\}/g, topic.toLowerCase()); }

  function chip(parent, text, pressed, onClick) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = text;
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.addEventListener("click", onClick);
    parent.appendChild(b);
    return b;
  }

  function buildChips() {
    var ins = document.getElementById("chips-ins"), loan = document.getElementById("chips-loan"), hk = document.getElementById("chips-hook");
    ins.innerHTML = ""; loan.innerHTML = ""; hk.innerHTML = "";
    var typed = els.custom.value.trim();
    TOPICS.ins.forEach(function (t) { chip(ins, t, !typed && state.topic === t, function () { els.custom.value = ""; setTopic(t); }); });
    TOPICS.loan.forEach(function (t) { chip(loan, t, !typed && state.topic === t, function () { els.custom.value = ""; setTopic(t); }); });
    Object.keys(HOOKS).forEach(function (k) {
      chip(hk, HOOKS[k].label, state.hook === k, function () { state.hook = k; state.variant = 0; regenerate(); });
    });
  }

  function currentTopic() { return els.custom.value.trim() || state.topic; }

  function setTopic(t) { state.topic = t; state.variant = 0; state.tipIdx = 0; regenerate(); }

  function regenerate() {
    var topic = currentTopic();
    var h = HOOKS[state.hook];
    var tips = TIPS[topic] || TIPS_DEFAULT;
    els.tag.value = h.tag;
    els.headline.value = fill(h.lines[state.variant % h.lines.length], topic);
    els.sub.value = tips[state.tipIdx % tips.length];
    buildChips();
    buildCaption();
    render();
  }

  document.getElementById("shuffle").addEventListener("click", function () {
    state.variant += 1; state.tipIdx += 1; regenerate();
  });
  els.custom.addEventListener("input", function () { state.variant = 0; state.tipIdx = 0; regenerate(); });
  ["tag", "size"].forEach(function (id) { els[id].addEventListener("input", render); els[id].addEventListener("change", render); });
  ["headline", "sub"].forEach(function (id) { els[id].addEventListener("input", function () { buildCaption(); render(); }); });

  var photoImg = new Image();
  photoImg.onload = render;
  photoImg.src = PHOTO;
  els.photo.addEventListener("change", function () {
    var f = els.photo.files && els.photo.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { photoImg = new Image(); photoImg.onload = render; photoImg.src = r.result; };
    r.readAsDataURL(f);
  });

  // ---- drawing ----
  var NAVY = "#0e1f4d", GREEN = "#1d6b2f", YELLOW = "#ffd60a", CREAM = "#fbf7e8";

  function wrap(ctx, text, maxW) {
    var words = text.split(/\s+/).filter(Boolean), lines = [], cur = "";
    words.forEach(function (w) {
      var test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else { cur = test; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function fit(ctx, text, family, weight, maxW, maxH, startPx, minPx, lh) {
    for (var px = startPx; px >= minPx; px -= 2) {
      ctx.font = weight + " " + px + "px " + family;
      var lines = wrap(ctx, text, maxW);
      if (lines.length * px * lh <= maxH) return { px: px, lines: lines };
    }
    ctx.font = weight + " " + minPx + "px " + family;
    return { px: minPx, lines: wrap(ctx, text, maxW) };
  }

  function render() {
    var parts = els.size.value.split("x"), W = +parts[0], H = +parts[1];
    var c = els.canvas, ctx = c.getContext("2d");
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    var M = 80;

    // background
    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
    drawNotes(ctx, W, H);

    // watermark: tiled, rotated brand line
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-24 * Math.PI / 180);
    ctx.fillStyle = "rgba(14,31,77,0.065)";
    ctx.font = "700 68px Caveat, 'Segoe Script', cursive";
    ctx.textBaseline = "middle";
    var step = 150, tw = ctx.measureText(WATERMARK).width + 110, span = Math.hypot(W, H);
    for (var y = -span / 2, row = 0; y < span / 2; y += step, row++) {
      for (var x = -span / 2 - (row % 2 ? tw / 2 : 0); x < span / 2; x += tw) ctx.fillText(WATERMARK, x, y);
    }
    ctx.restore();

    // tag (top left)
    var tag = els.tag.value.trim();
    var tagH = 0;
    if (tag) {
      ctx.save();
      ctx.font = "400 46px 'Archivo Black', Impact, sans-serif";
      ctx.textBaseline = "alphabetic";
      var tagW = ctx.measureText(tag).width + 64;
      tagH = 92;
      ctx.translate(M, 92); ctx.rotate(-1.2 * Math.PI / 180);
      ctx.fillStyle = GREEN; ctx.fillRect(0, 0, tagW, tagH);
      ctx.fillStyle = "#ffffff"; ctx.fillText(tag, 32, 64);
      ctx.restore();
    }

    // photo top right + handle underneath
    var D = 220, px = W - M - D, py = 64;
    ctx.save();
    ctx.shadowColor = "rgba(14,31,77,0.25)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.beginPath(); ctx.arc(px + D / 2, py + D / 2, D / 2 + 8, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(px + D / 2, py + D / 2, D / 2, 0, Math.PI * 2); ctx.clip();
    if (photoImg && photoImg.naturalWidth) {
      var s = Math.max(D / photoImg.naturalWidth, D / photoImg.naturalHeight);
      var iw = photoImg.naturalWidth * s, ih = photoImg.naturalHeight * s;
      ctx.drawImage(photoImg, px + (D - iw) / 2, py + (D - ih) / 2, iw, ih);
    }
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(px + D / 2, py + D / 2, D / 2, 0, Math.PI * 2);
    ctx.lineWidth = 8; ctx.strokeStyle = YELLOW; ctx.stroke();
    ctx.restore();
    ctx.fillStyle = NAVY; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
    ctx.font = "700 30px Archivo, Arial, sans-serif";
    ctx.fillText(HANDLE, W - M, py + D + 62);
    ctx.textAlign = "left";

    // headline block
    var top = py + D + 62 + 70;
    var footerY = H - 150;
    var area = footerY - top - 40;
    var headText = els.headline.value.trim() || " ";
    var subText = els.sub.value.trim();
    var maxW = W - M * 2;

    var hdl = fit(ctx, headText, "'Archivo Black', Impact, sans-serif", 400, maxW, area * (subText ? 0.64 : 0.9), H > 1500 ? 124 : 104, 44, 1.08);
    var subFit = subText ? fit(ctx, subText, "Archivo, Arial, sans-serif", 600, maxW, area * 0.3, 42, 26, 1.38) : null;
    var headBlock = hdl.lines.length * hdl.px * 1.08;
    var gap = 40, barH = 12;
    var subBlock = subFit ? subFit.lines.length * subFit.px * 1.38 : 0;
    var total = headBlock + (subFit ? gap + barH + gap + subBlock : gap + barH);
    var y0 = top + Math.max(0, (area - total) * 0.35);

    ctx.fillStyle = NAVY; ctx.textBaseline = "top";
    ctx.font = "400 " + hdl.px + "px 'Archivo Black', Impact, sans-serif";
    hdl.lines.forEach(function (ln, i) { ctx.fillText(ln, M, y0 + i * hdl.px * 1.08); });
    var yb = y0 + headBlock + gap;
    ctx.fillStyle = YELLOW;
    ctx.save(); ctx.translate(M, yb); ctx.rotate(-0.4 * Math.PI / 180); ctx.fillRect(0, 0, Math.min(420, maxW), barH); ctx.restore();
    if (subFit) {
      ctx.fillStyle = "#26335f";
      ctx.font = "600 " + subFit.px + "px Archivo, Arial, sans-serif";
      subFit.lines.forEach(function (ln, i) { ctx.fillText(ln, M, yb + barH + gap + i * subFit.px * 1.38); });
    }

    // footer
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = NAVY;
    ctx.font = "700 76px Caveat, 'Segoe Script', cursive";
    ctx.fillText("Give Every Dollar a Job", M, H - 80);
    ctx.fillStyle = "#3a4670";
    ctx.font = "700 28px Archivo, Arial, sans-serif";
    ctx.fillText("Save smart. Spend wisely. Build wealth.", M, H - 36);
  }

  // ---- dollar notes (generic banknote artwork, not a real currency design) ----
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function noteOne(ctx, w, h) {
    var x = -w / 2, y = -h / 2;
    rr(ctx, x, y, w, h, 18); ctx.fillStyle = GREEN; ctx.fill();
    ctx.strokeStyle = CREAM; ctx.fillStyle = CREAM;
    rr(ctx, x + 14, y + 14, w - 28, h - 28, 10); ctx.lineWidth = 5; ctx.stroke();
    rr(ctx, x + 32, y + 32, w - 64, h - 64, 6); ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    rr(ctx, x + 32, y + 32, w - 64, h - 64, 6); ctx.clip();
    ctx.lineWidth = 1.6;
    for (var i = 1; i <= 9; i++) {
      ctx.beginPath(); ctx.ellipse(0, 0, h * 0.36 + i * 22, h * 0.36 + i * 14, 0, 0, Math.PI * 2); ctx.stroke();
    }
    for (var j = -14; j <= 14; j++) {
      ctx.beginPath(); ctx.moveTo(x + 32, j * 22); ctx.bezierCurveTo(x + w * 0.3, j * 22 + 26, x + w * 0.7, j * 22 - 26, x + w - 32, j * 22); ctx.stroke();
    }
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0, h * 0.3, h * 0.37, 0, 0, Math.PI * 2); ctx.fillStyle = CREAM; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, h * 0.3 - 10, h * 0.37 - 10, 0, 0, Math.PI * 2); ctx.strokeStyle = GREEN; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = GREEN; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "400 " + Math.round(h * 0.42) + "px 'Archivo Black', Impact, sans-serif";
    ctx.fillText("$", 0, h * 0.02);
    var cr = h * 0.09, cxs = [x + 90, x + w - 90], cys = [y + 84, y + h - 84];
    cxs.forEach(function (cx) { cys.forEach(function (cy) {
      ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fillStyle = CREAM; ctx.fill();
      ctx.fillStyle = GREEN; ctx.font = "400 " + Math.round(cr * 1.2) + "px 'Archivo Black', Impact, sans-serif"; ctx.fillText("$", cx, cy + 2);
    }); });
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawNotes(ctx, W, H) {
    var w = Math.min(W * 0.98, H * 0.9), h = w * 0.43;
    ctx.save(); ctx.translate(W / 2 + 26, H * 0.5 - 70); ctx.rotate(8 * Math.PI / 180); ctx.globalAlpha = 0.09; noteOne(ctx, w, h); ctx.restore();
    ctx.save(); ctx.translate(W / 2, H * 0.5 + 20); ctx.rotate(-9 * Math.PI / 180); ctx.globalAlpha = 0.14; noteOne(ctx, w, h); ctx.restore();
  }

  // ---- caption and hashtags ----
  var CTAS = [
    "Save this for later and share it with someone who needs it.",
    "Follow @giveeverydollarajob for more money tips.",
    "Tag a friend who should see this.",
    "Send this to someone who is about to sign."
  ];
  var HOOK_TAGS = { question: "moneyquestions", mistake: "moneymistakes", myth: "mythbusting", tip: "moneytips", warning: "moneywarning", checklist: "moneychecklist", challenge: "moneychallenge", shift: "moneymindset" };
  var VOCAB = [
    [/deductible/, "deductible"], [/premium/, "lowerpremiums"], [/quote/, "comparequotes"], [/closing|break-even/, "closingcosts"],
    [/\bapr\b|\brates?\b/, "interestrates"], [/repay/, "loanrepayment"], [/beneficiar/, "beneficiaries"], [/\bfees?\b/, "hiddenfees"],
    [/cover/, "coverage"], [/budget/, "budgeting"], [/debt/, "debtfree"], [/credit/, "creditscore"]
  ];

  function hashtags() {
    var topic = currentTopic(), l = topic.toLowerCase(), out = [];
    function add(t) { t = String(t).toLowerCase().replace(/[^a-z0-9]/g, ""); if (t.length > 2 && out.indexOf("#" + t) < 0) out.push("#" + t); }
    add(topic);
    if (/insur/.test(l)) add("insurance"); else if (/mortgage|refinanc|home/.test(l)) add("mortgage"); else if (/loan|borrow|debt/.test(l)) add("loans");
    var body = (els.headline.value + " " + els.sub.value).toLowerCase();
    for (var i = 0; i < VOCAB.length; i++) { if (VOCAB[i][0].test(body)) { add(VOCAB[i][1]); break; } }
    add(HOOK_TAGS[state.hook] || "moneytips");
    add("personalfinance");
    return out.slice(0, 5);
  }

  function buildCaption() {
    var h = els.headline.value.trim(), s = els.sub.value.trim();
    var parts = [h, s, CTAS[(state.cta || 0) % CTAS.length], hashtags().join(" ")].filter(Boolean);
    els.caption.value = parts.join("\n\n");
  }

  document.getElementById("recap").addEventListener("click", function () { state.cta = (state.cta || 0) + 1; buildCaption(); say("Caption rewritten."); });
  document.getElementById("copycap").addEventListener("click", function () {
    function fallback() { els.caption.focus(); els.caption.select(); say("Caption selected. Press Ctrl+C or Cmd+C to copy it."); }
    try {
      navigator.clipboard.writeText(els.caption.value).then(function () { say("Caption copied."); }, fallback);
    } catch (e) { fallback(); }
  });

  function say(msg) { els.note.textContent = msg; }

  document.getElementById("show").addEventListener("click", function () {
    render();
    els.out.src = els.canvas.toDataURL("image/png");
    els.saved.classList.add("on");
    try {
      var a = document.createElement("a");
      a.href = els.out.src; a.download = "giveeverydollarajob-postcard.png";
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
    say("If no download started, right-click or press and hold the image below and choose Save image.");
    els.out.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  document.getElementById("copy").addEventListener("click", function () {
    render();
    els.canvas.toBlob(function (blob) {
      if (!blob) { say("Could not make the image. Try Get image to save."); return; }
      try {
        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(
          function () { say("Image copied. Paste it into your post or chat."); },
          function () { say("Copying is blocked here. Use Get image to save instead."); }
        );
      } catch (e) { say("Copying is blocked here. Use Get image to save instead."); }
    }, "image/png");
  });

  regenerate();
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("400 60px 'Archivo Black'"), document.fonts.load("600 40px Archivo"),
      document.fonts.load("700 30px Archivo"), document.fonts.load("700 60px Caveat")
    ]).then(render, render);
  }
})();
</script>

</body></html>
