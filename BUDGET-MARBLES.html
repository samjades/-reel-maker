<header><h1>BUDGET <span>MARBLES</span></h1><small>Your paycheck falls as marbles. Watch every one find its job.</small></header>
<main>

  <label><span>Peg ticks</span><input type="checkbox" id="tk" checked></label>
  <label><span>Pay yourself first</span><input type="checkbox" id="pf"></label>
  <button id="play">▶ Pay day!</button><button class="s" id="stop">■ Reset</button><button class="r" id="rec">● Record</button>
 </div>

</section>
</main>

function land(m){const b=m.b;b.cnt;b.amt+=unit;b.fl=1;landedN++;const j=b.j,el=$('#am'+j);el.textContent=fmt(Math.round(b.amt*100)/100);$('#bb'+j).style.width=Math.min(100,b.amt/Math.max(unit,b.n*unit)*100)+'%';
 const cd=$('#cd'+j);cd.classList.remove('hot');void cd.offsetWidth;cd.classList.add('hot');
 const d=landedN*unit;$('#dist').textContent=fmt(Math.round(d*100)/100);$('#bar').style.width=(landedN/goalN*100)+'%';
 if(cats[j].s==='cash')burst(b.xc,BY+1.2,14,b.col);else burst(b.xc,BY+.8,5,b.col);
 if(landedN===goalN)finish()}
function finish(){run=false;fin=true;const sv=cats.map((c,j)=>c.s==='cash'?bins[j].amt:0).reduce((a,b)=>a+b,0),sc=cats.findIndex(c=>c.s==='cash'),rate=Math.round(sv/pay*100);
 const t=sc>=0?`✅ Every ${$('#cur').value} has a job! Savings: ${fmt(Math.round(sv*100)/100)} (${rate}%)`:`✅ Every ${$('#cur').value} has a job!`;
 const bn=$('#ban');bn.textContent=t;bn.classList.remove('show');void bn.offsetWidth;bn.classList.add('show');
 if(sc>=0){burst(bins[sc].xc,BY+2,120,'#5eead4');burst(bins[sc].xc,BY+2.5,80,'#ffd166');if(AC){PG=AC.createGain();PG.connect(MG);const t1=AC.currentTime+.05;if($('#sm').value!=='off')[0,1,2].forEach(q=>ching(t1+q*.2,.4))}}
 msg(sc>=0?`Savings rate: ${rate}%. Tip: try raising it by 1% each month.`:'Done! Edit the bins and run it again.')}
$('#play').onclick=play;
$('#stop').onclick=()=>{run=false;fin=false;if(PG){PG.gain.value=0;PG.disconnect()}build();msg('Reset. Press ▶ Pay day!')};
$('#pre').onchange=()=>{loadPre();if(!run)build()};
['pay','cur','mc'].forEach(id=>$('#'+id).oninput=()=>{if(!run)build()});
$('#gap').oninput=e=>$('#gv').textContent=e.target.value;
$('#rec').onclick=()=>{if(rec){rec.stop();return}
 try{audioOn();const cs=$('#c').captureStream(60);REC.stream.getAudioTracks().forEach(t=>cs.addTrack(t));
  const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)return msg('Video recording is not supported in this browser.');
  const ch=[];rec=new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  rec.onstop=()=>{const ext=mime.includes('mp4')?'mp4':'webm',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mime}));a.download='budget-marbles.'+ext;a.click();rec=null;$('#rec').textContent='● Record';msg('Saved as '+ext.toUpperCase()+'.')};
  rec.start(250);$('#rec').textContent='■ Stop & save';msg('Recording… press ▶ Pay day!, then ■ Stop & save when it ends.')}catch(e){rec=null;msg('Recording failed in this browser.')}};
function resize(){const w=$('#stage').clientWidth,hh=$('#stage').clientHeight,t=Math.tan(cam.fov*Math.PI/360);cam.aspect=w/hh;cam.updateProjectionMatrix();R0.setSize(w,hh,false);fitZ=Math.max(10/(cam.aspect*t),8.2/t);cam.position.set(0,6.6,fitZ);cam.lookAt(0,6.6,0)}
addEventListener('resize',resize);
// ---------- loop
const clock=new THREE.Clock(),dm=new THREE.Object3D(),pc0=new THREE.Color(.8,.86,.95),gc=new THREE.Color(1,.82,.3);
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);simT+=dt;
 if(run||fin||mar.length){const t=run?AC.currentTime-t0:1e9;let cnt=0;
  mar.forEach((m,i)=>{if(!m.sch&&run&&t>=m.st-.5){m.sch=true;sched(m)}
   const tt=t-m.st;if(tt<0)return;cnt=i+1;let x,y;
   if(tt<F){x=0;y=ty(0)+1.3-11*tt*tt}
   else{const u=tt-F;if(u<Rr*Tp){const r=Math.floor(u/Tp),w=u-r*Tp,a=m.mx[r];x=(a+(m.mx[r+1]-a)*w/Tp)*h;y=ty(r)+hv.vy*w-.5*hv.g*w*w;if(w<.1){const id=pegIdx.get(r*64+a+32);if(id!==undefined)pegF[id]=Math.max(pegF[id],1-w/.1)}}
    else{const v=u-Rr*Tp;if(v<m.fb){x=m.xR+(m.sx-m.xR)*v/m.fb;y=m.yR+m.vyE*v-11*v*v}else{x=m.sx;y=m.sy;if(!m.landed&&run){m.landed=true;land(m)}}}}
   dm.position.set(x,y,0);dm.updateMatrix();im.setMatrixAt(i,dm.matrix)});
  im.count=cnt;im.instanceMatrix.needsUpdate=true}
 if(pegM){for(let i=0;i<pegF.length;i++)pegF[i]=Math.max(0,pegF[i]-dt*5);
  const c=new THREE.Color();for(let i=0;i<pegF.length;i++){c.copy(pc0).lerp(gc,pegF[i]);pegM.setColorAt(i,c)}pegM.instanceColor.needsUpdate=true}
 bins.forEach(b=>{b.fl=Math.max(0,b.fl-dt*3);b.mesh.material.emissive.set(b.col).multiplyScalar(b.fl*.9)});
 for(let i=0;i<NP;i++)if(pl[i]>0){pl[i]-=dt;pv[i*3+1]-=9*dt;for(let k=0;k<3;k++)pp[i*3+k]+=pv[i*3+k]*dt;for(let k=0;k<3;k++)pc[i*3+k]*=1-dt*.9;if(pl[i]<=0)pp[i*3+1]=-99}
 pg.attributes.position.needsUpdate=pg.attributes.color.needsUpdate=true;R0.render(S,cam)}
loadPre();resize();build();frame();
})();
