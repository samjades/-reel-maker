<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Postcard Generator</title>
<style>
:root{--bg:#faf6e9;--fg:#0f2150;--card:#fff;--bd:#d8d2bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--fg:#eee;--card:#1e2130;--bd:#3a3f55}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;padding:16px}
.w{max-width:620px;margin:auto}h1{font-size:20px}label{display:block;font-size:13px;margin:10px 0 4px;font-weight:600}
select,textarea,input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px;box-sizing:border-box}
textarea{height:80px}.r{display:flex;gap:8px}.r>*{flex:1}button{padding:11px;border:0;border-radius:8px;background:#1e6b2e;color:#fff;font-weight:700;font-size:15px;margin-top:12px;width:100%}
img#o{display:block;max-width:100%;max-height:80vh;margin:14px auto 0;border-radius:10px;border:1px solid var(--bd)}p.s{font-size:12px;opacity:.75}
</style></head><body><div class="w"><h1>Give Every Dollar a Job · Postcard Generator</h1>
<div class="r"><div><label>Category</label><select id="c"></select></div><div><label>Topic</label><select id="t"></select></div></div>
<div class="r"><div><label>Screen ratio</label><select id="r"><option value="1080x1080">1:1 Square</option><option value="1080x1920">9:16 Story / Reel</option><option value="1920x1080">16:9 Landscape</option></select></div><div><label>Background</label><select id="b"></select></div></div>
<label>Money image</label><select id="m"><option value="top">Top: single stack</option><option value="double">Top: double stacks</option><option value="topbg">Top + faded background</option><option value="bg">Background: large faded</option><option value="corner">Bottom-right corner</option><option value="float">Floating stacks</option><option value="tile">Pattern: tiled stacks</option><option value="none">None</option></select>
<label>Hook type</label><select id="h"></select>
<label>Hook text (editable)</label><textarea id="x"></textarea>
<div class="r"><div><label>Handle</label><input type="text" id="u" value="@giveeverydollarajob"></div><div><label>Your photo</label><input type="file" id="f" accept="image/*"></div></div>
<button id="n">🔀 Shuffle hook</button>
<img id="o" alt="Postcard preview"><p class="s">Tap and hold (phone) or right-click (desktop) the postcard to save it as an image.</p></div>

 payment instead of five? Check if consolidation really lowers your cost.","Consolidating debt only works if you stop adding new debt."],"Business Loans":["Borrow for growth, not for panic. Know your repayment plan first.","Before you take a business loan, know your numbers cold."],"Car Loans":["A longer car loan means a lower payment, but more interest paid.","Get your loan pre-approved before you step into the dealership."],"Bad Credit Loans":["Bad credit isn’t the end. But watch out for sky-high rates.","Need a loan with low credit? Read every fee before you sign."],"Home Equity Loan":["Your home is the collateral. Borrow against it carefully.","Using home equity? Make sure the project is worth the risk."],"Emergency Fund":["Start small. Even a tiny amount today begins your emergency fund.","An emergency fund turns a crisis into an inconvenience."],"Savings Account":["Is your savings account earning anything? Compare rates today.","Money sitting in the wrong account is money losing its power."],"Investing for Beginners":["You don’t need to be rich to start investing. You need to start.","Time in the market beats waiting for the perfect moment."],"Retirement Planning":["Future you is counting on present you. Start now, even if small.","The earlier you start saving for retirement, the less you have to save each month."],"Side Hustle Savings":["Side hustle income: give it a job before it disappears.","Save the first 20% of every side hustle payment before you spend any."],"Fixed Deposits":["Want your money to grow without risk? Look at fixed deposits.","Lock it in, let it grow, and don’t touch it."],"Index Funds":["Don’t pick stocks. Own the whole market with index funds.","Low fees, wide spread, long-term growth: why many beginners start here."],"Money Market Accounts":["Looking for a safe place to park cash? Compare money market accounts.","Savings that stay accessible and still earn more."],"Kids’ Savings":["The best money lesson? Let your child watch their savin
