<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhymeMagic AI – Nursery Rhyme Video Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--ink:#2b2140;--mut:#7a6f8f;--card:#fff;--pk:#ff4f8b;--am:#ffb627;--bl:#3a86ff;--ln:#f0e3c8}
@media(prefers-color-scheme:dark){:root{--bg:#1d1730;--ink:#f6efff;--mut:#b4a8cc;--card:#2a2243;--ln:#3d3360}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Fredoka,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 20px;background:var(--card);border-bottom:3px solid var(--am);position:sticky;top:0;z-index:5}
header h1{margin:0 auto 0 0;font-size:22px}header h1 span{color:var(--pk)}
button,.btn{font:600 14px Fredoka,sans-serif;border:0;border-radius:12px;padding:9px 15px;background:var(--ln);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.pri{background:var(--pk);color:#fff}.on{background:var(--ink);color:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 2px 0 var(--ln)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
label{font-weight:600;font-size:14px}h2{margin:.2em 0 .4em}h3{margin:.2em 0}
small,.mut{color:var(--mut)}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
canvas{width:100%;max-width:640px;display:block;margin:0 auto 10px;border-radius:14px;background:#000}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}
.scene{display:grid;grid-template-columns:230px 1fr;gap:14px}@media(max-width:640px){.scene{grid-template-columns:1fr}}
.scene img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--ln);display:flex;align-items:center;justify-content:center;font-size:48px}
code,pre{font:12px/1.5 ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:8px;display:block;white-space:pre-wrap}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;max-width:90vw;display:none;z-index:9}
.chip{display:inline-block;background:var(--ln);border-radius:20px;padding:2px 10px;margin:2px;font-size:13px}
</style></head><body>
<header><h1>🦆 Rhyme<span>Magic</span> AI</h1>
<button onclick="go('home')">Projects</button><button class="pri" onclick="go('create')">+ Create</button>
<button onclick="go('series')">Series</button><button onclick="go('settings')">Settings</button></header>
<main id="main"></main><div id="msg" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=()=>{try{localStorage.setItem('rm_p',JSON.stringify(S.projects));localStorage.setItem('rm_k',JSON.stringify(S.key))}catch(e){}};
const mk=(t,d,l,e,v,pr)=>({title:t,dur:d,lyrics:l,emoji:e,visual:v,camera:'Medium shot, gentle push-in',imagePrompt:pr,videoPrompt:v+' Smooth cheerful 3D animation.'});
const DEMO={id:'demo',title:"The Little Duck's Counting Adventure",idea:'A cheerful yellow duckling counts from one to five with pond friends.',ratio:'16:9',secs:60,age:'3-4 years',type:'Counting song',style:'Colorful 3D preschool animation',
character:{name:'Dippy the Duckling',species:'Yellow baby duck',look:'Round fluffy body, big glossy eyes, coral beak, blue polka-dot bowtie',prompt:'3D Pixar-style round fluffy baby duckling named Dippy, daffodil yellow feathers, tiny blue polka dot bowtie, big sparkling eyes, coral orange beak, soft studio lighting'},
lyrics:[{label:'Intro',lines:['Quack, quack, splash! Ready to count with Dippy?','One, two, three, four, five! Here we go!']},{label:'Verse 1',lines:['One little yellow duck swimming in the sun,','Along came a green frog and now there are TWO, fun!']},{label:'Chorus',lines:['Waddle, waddle, quack, quack! Tap your little feet!','Counting all our pond friends to the happy beat!']},{label:'Verse 2',lines:['Three fluttering butterflies dancing in the breeze,','Four hopping bunnies jumping round the trees,','Five splashing ducklings swimming in a line,','One, two, three, four, five! Counting feels so fine!']},{label:'Outro',lines:['Five happy friends wave goodbye! Quack quack quack!']}],
music:{genre:'Playful preschool pop',bpm:118,prompt:'Bouncy upbeat preschool nursery rhyme, 118 BPM, ukulele, xylophone, handclaps on 2 and 4, warm acoustic bass, friendly vocals'},
scenes:[mk('Dippy Splashes In',10,'Quack, quack, splash! Ready to count with Dippy? One, two, three, four, five!','🦆','Dippy leaps into a sparkling sunny pond.','3D cartoon baby yellow duck splashing into a sparkling pond with pink lily pads, sunbeams'),mk('One and Two Friends',12,'One little yellow duck swimming in the sun, along came a green frog and now there are TWO!','🐸','A green frog hops onto a lily pad beside Dippy.','3D cartoon yellow duckling and green frog on a giant lily pad, glowing numbers 1 and 2'),mk('Waddle Dance',12,'Waddle, waddle, quack, quack! Tap your little feet!','🎵','Dippy and Freddie dance in rhythm.','3D cartoon duckling and frog dancing on a pebble beach, floating music notes'),mk('Counting to Five',14,'Three butterflies, four bunnies, five ducklings in line! One, two, three, four, five!','🦋','Butterflies, bunnies and ducklings appear as counted.','3D cartoon meadow with 3 butterflies, 4 bunnies and 5 ducklings by a pond'),mk('Goodbye Wave',12,'Five happy friends wave goodbye! Great counting today! Quack quack quack!','👋','Everyone waves at sunset.','3D cartoon duckling waving goodbye at a warm sunset pond with animal friends')],
publish:{titles:['Count to 5 with Dippy the Duck! 🦆 | Preschool Learning Song','One Little Duck: Easy Counting Rhyme for Toddlers','Quack, Splash, Count! Nursery Rhyme for Kids'],description:'Join Dippy the duckling as we count from 1 to 5 with frogs, butterflies and bunnies! An original sing-along for toddlers and preschoolers.',hashtags:['#NurseryRhymes','#CountingSong','#KidsLearning','#PreschoolSongs'],ideas:['Dippy Learns the Rainbow Colors','Five Little Ducks Bedtime Lullaby','Dippy’s Shape Adventure']}};
const S={projects:ld('rm_p',[DEMO]),key:ld('rm_k',''),i:0};if(!S.projects.length)S.projects=[DEMO];
const cur=()=>S.projects[S.i];let V='home',T='lyrics',IM={},SER=[],P={ctx:null,raf:0,t:0,playing:false,t0:0,from:0},BUSY='';
const DIM={'16:9':[1280,720],'9:16':[540,960],'1:1':[800,800]},SECS={'15s':15,'30s':30,'60s':60,'90s':90,'2m':120,'3m':180};
const total=p=>p.scenes.reduce((a,s)=>a+s.dur,0);
function msg(t,ms=4500){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',ms)}
function go(v,t){stop();V=v;if(t)T=t;render();scrollTo(0,0)}
function dl(c,n,t){const a=document.createElement('a');a.href=c instanceof Blob?URL.createObjectURL(c):URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
const cp=t=>navigator.clipboard.writeText(t).then(()=>msg('Copied'));
/* ---------- Gemini (browser → Google API, key stays in this browser) ---------- */
async function gem(prompt){
 if(!S.key)throw new Error('Add your Gemini API key in Settings first.');
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.8}})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Request failed ('+r.status+')');
 const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text).join('');
 return JSON.parse(t.replace(/^\s*```(json)?/,'').replace(/```\s*$/,'').trim());
}
async function create(){
 const f={idea:$('#idea').value.trim(),type:$('#type').value,age:$('#age').value,ratio:$('#ratio').value,dur:$('#dur').value,style:$('#style').value,mood:$('#mood').value,lang:$('#lang').value||'English',char:$('#char').value};
 if(!f.idea)return msg('Describe your rhyme idea first.');
 const secs=SECS[f.dur],n=Math.max(2,Math.round(secs/11));BUSY='create';render();
 try{
  const g=await gem(`You are a children's media producer. Create an ORIGINAL, safe, positive nursery rhyme production plan. No copyrighted characters or lyrics.
Idea: ${f.idea}. Type: ${f.type}. Age: ${f.age}. Language: ${f.lang}. Visual style: ${f.style}. Music mood: ${f.mood}. Main character: ${f.char||'original cute character'}. Length: ${secs} seconds, exactly ${n} scenes.
Return JSON: {"title":"","character":{"name":"","species":"","look":"","consistencyPrompt":""},"lyrics":[{"label":"Verse 1","lines":[""]}],"music":{"genre":"","bpm":110,"prompt":""},"scenes":[{"title":"","duration":10,"lyricsPlaying":"","emoji":"one emoji","visualDescription":"","cameraFraming":"","imagePrompt":"","videoPrompt":""}],"publish":{"titles":["x5"],"description":"","hashtags":[""],"ideas":["x5"]}}
Scene durations must sum to ${secs}. Scene lyrics must follow the lyrics in order. Every imagePrompt must repeat the character's consistencyPrompt.`);
  let sc=(g.scenes||[]).map(s=>({title:s.title||'Scene',dur:+s.duration||10,lyrics:s.lyricsPlaying||'',emoji:s.emoji||'🎵',visual:s.visualDescription||'',camera:s.cameraFraming||'',imagePrompt:s.imagePrompt||'',videoPrompt:s.videoPrompt||''}));
  if(!sc.length)throw new Error('The AI returned no scenes. Try again.');
  const k=secs/sc.reduce((a,s)=>a+s.dur,0);sc.forEach(s=>s.dur=Math.max(3,Math.round(s.dur*k)));
  const c=g.character||{};
  S.projects.unshift({id:'p'+Date.now(),title:g.title||'Untitled rhyme',idea:f.idea,ratio:f.ratio,secs,age:f.age,type:f.type,style:f.style,
   character:{name:c.name||'Hero',species:c.species||'',look:c.look||'',prompt:c.consistencyPrompt||''},lyrics:(g.lyrics||[]).map(l=>({label:l.label||'',lines:l.lines||[]})),
   music:{genre:g.music?.genre||'',bpm:+g.music?.bpm||110,prompt:g.music?.prompt||''},scenes:sc,publish:g.publish||{titles:[],description:'',hashtags:[],ideas:[]}});
  S.i=0;sv();BUSY='';go('proj','lyrics');
 }catch(e){BUSY='';render();msg('Could not create: '+e.message,8000)}
}
async function series(){const p=cur();BUSY='series';render();
 try{const g=await gem(`Plan a 5-episode preschool nursery rhyme series featuring "${p.character.name}", a ${p.character.species}. Return JSON {"episodes":[{"title":"","coreIdea":"","educationalObjective":"","distinctiveActivity":""}]}`);SER=g.episodes||[]}
 catch(e){msg(e.message,8000)}BUSY='';render()}
/* ---------- Images (free Pollinations service; falls back to drawn scenes) ---------- */
function genImg(i){const p=cur(),[w,h]=DIM[p.ratio],s=p.scenes[i];
 s.img=`https://image.pollinations.ai/prompt/${encodeURIComponent((s.imagePrompt+', '+p.style).slice(0,400))}?width=${w}&height=${h}&nologo=true&seed=${Math.floor(Math.random()*1e6)}`;sv();render()}
async function genAll(){const p=cur();for(let i=0;i<p.scenes.length;i++){genImg(i);await new Promise(r=>setTimeout(r,1200))}}
function img(u){if(!u)return null;if(!IM[u]){const i=new Image();i.crossOrigin='anonymous';i.onload=()=>draw(P.t);i.src=u;IM[u]=i}return IM[u]}
/* ---------- Canvas renderer ---------- */
function frame(c,w,h,p,t){
 let a=0,s=p.scenes[p.scenes.length-1],l=0;for(const x of p.scenes){if(t<a+x.dur){s=x;l=t-a;break}a+=x.dur}
 const i=p.scenes.indexOf(s),im=img(s.img),m=Math.min(w,h);
 if(im&&im.complete&&im.naturalWidth){const r=Math.max(w/im.naturalWidth,h/im.naturalHeight)*(1+.06*l/s.dur),iw=im.naturalWidth*r,ih=im.naturalHeight*r;c.drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih)}
 else{const hu=(i*55+200)%360,g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${hu},85%,72%)`);g.addColorStop(1,`hsl(${hu+50},85%,60%)`);c.fillStyle=g;c.fillRect(0,0,w,h);
  c.textAlign='center';c.textBaseline='middle';c.font=`${m*.36}px serif`;const b=Math.abs(Math.sin(t*Math.PI*(p.music.bpm||110)/60));c.fillText(s.emoji,w/2,h*.4-b*m*.05);
  c.font=`600 ${m*.05}px Fredoka,sans-serif`;c.fillStyle='#fff';c.fillText(s.title,w/2,h*.62)}
 const sc=c.createLinearGradient(0,h*.6,0,h);sc.addColorStop(0,'rgba(0,0,0,0)');sc.addColorStop(1,'rgba(0,0,0,.7)');c.fillStyle=sc;c.fillRect(0,h*.6,w,h*.4);
 const fs=m*.055;c.font=`700 ${fs}px Fredoka,sans-serif`;c.textAlign='center';c.textBaseline='alphabetic';c.lineJoin='round';
 const ws=(s.lyrics||'').split(' '),ln=[];let cu='';for(const x of ws){const q=cu?cu+' '+x:x;if(c.measureText(q).width>w*.9&&cu){ln.push(cu);cu=x}else cu=q}if(cu)ln.push(cu);
 ln.forEach((q,k)=>{const y=h-fs*.7-(ln.length-1-k)*fs*1.25;c.lineWidth=fs*.2;c.strokeStyle='#000';c.strokeText(q,w/2,y);c.fillStyle='#fff3a0';c.fillText(q,w/2,y)});
}
function draw(t){const cv=$('#cv');if(cv)frame(cv.getContext('2d'),cv.width,cv.height,cur(),t)}
/* ---------- Synth music (Web Audio) ---------- */
const PEN=[261.63,293.66,329.63,392,440,523.25,587.33,659.25],MEL=[0,2,4,2,0,2,4,7,7,5,4,2,3,2,0,-1];
function tone(ac,out,f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05)}
function sched(ac,out,bpm,from,tot,t0){const spb=60/bpm,nb=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
 for(let b=Math.floor(from/spb);b*spb<tot;b++){const tm=t0+b*spb-from;if(tm<t0)continue;const n=MEL[b%16];if(n>=0)tone(ac,out,PEN[n],tm,spb*.85,'triangle',.2);
  if(b%2===0)tone(ac,out,b%8<4?130.8:98,tm,spb*.9,'sine',.25);
  if(b%2===1){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=nb;g.gain.value=.15;s.connect(g);g.connect(out);s.start(tm)}}}
function play(){const p=cur(),tot=total(p),from=P.t>=tot-.1?0:P.t;stop();const ac=new AudioContext();P.ctx=ac;const t0=ac.currentTime+.05;
 sched(ac,ac.destination,p.music.bpm||110,from,tot,t0);P.t0=t0;P.from=from;P.playing=true;$('#pp').textContent='⏸ Pause';
 const loop=()=>{if(!P.playing)return;const t=from+ac.currentTime-t0;if(t>=tot){stop();P.t=0;draw(0);upd(0);return}P.t=Math.max(0,t);draw(P.t);upd(P.t);P.raf=requestAnimationFrame(loop)};loop()}
function stop(){P.playing=false;cancelAnimationFrame(P.raf);if(P.ctx){P.ctx.close();P.ctx=null}const b=$('#pp');if(b)b.textContent='▶ Play'}
function upd(t){const k=$('#sk'),m=$('#tm');if(k)k.value=t;if(m)m.textContent=Math.floor(t)+'s / '+total(cur())+'s'}
/* ---------- Real video export: canvas + synth audio → MediaRecorder ---------- */
async function exp(){const p=cur(),tot=total(p),[w,h]=DIM[p.ratio],cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d'),xp=$('#xp');stop();
 xp.textContent='Loading images…';
 await Promise.all(p.scenes.map(s=>new Promise(r=>{const i=img(s.img);if(!i||i.complete)r();else{i.addEventListener('load',r);i.addEventListener('error',r)}})));
 const ac=new AudioContext(),dest=ac.createMediaStreamDestination(),t0=ac.currentTime+.2;sched(ac,dest,p.music.bpm||110,0,tot,t0);
 const st=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
 const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
 if(!mime){msg('This browser cannot record video. Try Chrome, Edge or Firefox.');return}
 const rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:4e6}),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{ac.close();const b=new Blob(ch,{type:mime.split(';')[0]}),ext=mime.includes('mp4')?'mp4':'webm',u=URL.createObjectURL(b);
  xp.innerHTML=`Done! <a class="btn pri" href="${u}" download="${esc(p.title)}.${ext}">Download video (.${ext})</a>`};
 rec.start(250);
 const loop=()=>{const t=ac.currentTime-t0;if(t>=tot+.3){rec.stop();return}const tt=Math.max(0,Math.min(t,tot-.01));frame(c,w,h,p,tt);xp.textContent=`Rendering in real time… ${Math.round(tt/tot*100)}% (keep this tab open)`;requestAnimationFrame(loop)};loop()}
/* ---------- Views ---------- */
const opt=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
function render(){const m=$('#main');
 if(V==='home')m.innerHTML=`<div class=card><h2>Make a nursery rhyme video in minutes</h2><p class=mut>Lyrics, character, storyboard, music and a real downloadable video with sing-along captions.</p><button class=pri onclick="go('create')">Create my rhyme</button></div>
 <div class=grid>${S.projects.map((p,i)=>`<div class=card><span class=chip>${esc(p.type)}</span><span class=chip>${p.secs}s · ${p.ratio}</span><h3>${esc(p.title)}</h3><p class=mut>${esc(p.idea)}</p><div class=row><button class=pri onclick="S.i=${i};go('proj','lyrics')">Open studio</button><button onclick="if(confirm('Delete this project?')){S.projects.splice(${i},1);if(!S.projects.length)S.projects=[DEMO];sv();render()}">Delete</button></div></div>`).join('')}</div>`;
 else if(V==='create')m.innerHTML=`<div class=card><h2>Create a nursery rhyme</h2>${S.key?'':'<p><b>First:</b> add your free Gemini API key in <a href="#" onclick="go(\'settings\');return false">Settings</a>.</p>'}
 <label>What is it about?</label><textarea id=idea rows=3>A friendly yellow duck explores a magical pond and teaches children to count from one to five.</textarea>
 <div class=grid><div><label>Type</label><select id=type>${opt(['Counting song','Original nursery rhyme','Alphabet song','Animal song','Colors and shapes song','Bedtime lullaby','Dancing song'])}</select></div>
 <div><label>Age</label><select id=age>${opt(['1-2 years','3-4 years','5-6 years','7-8 years'],'3-4 years')}</select></div>
 <div><label>Format</label><select id=ratio>${opt(['16:9','9:16','1:1'])}</select></div>
 <div><label>Length</label><select id=dur>${opt(Object.keys(SECS),'60s')}</select></div>
 <div><label>Visual style</label><select id=style>${opt(['Colorful 3D preschool animation','Cute animal cartoons','Soft pastel storybook','Clay animation','Toy-like 3D world'])}</select></div>
 <div><label>Music mood</label><select id=mood>${opt(['Happy and playful','Bouncy and energetic','Gentle bedtime lullaby','Clapping and dancing rhythm','Acoustic preschool pop'])}</select></div>
 <div><label>Lyrics language</label><input id=lang value="English"></div><div><label>Main character (optional)</label><input id=char placeholder="e.g. Barnaby the baby dinosaur"></div></div>
 <button class=pri onclick="create()" ${BUSY?'disabled':''}>${BUSY==='create'?'Writing your rhyme… (20-40s)':'Create my rhyme video'}</button></div>`;
 else if(V==='settings')m.innerHTML=`<div class=card><h2>Settings</h2><label>Google Gemini API key</label><input id=key type=password value="${esc(S.key)}" placeholder="AIza…" autocomplete=off>
 <button class=pri onclick="S.key=$('#key').value.trim();sv();msg('Saved in this browser')">Save key</button>
 <p class=mut>Get a free key at <a href="https://aistudio.google.com/apikey" target=_blank rel=noopener>aistudio.google.com/apikey</a>. It is stored only in this browser and sent only to Google. GitHub Pages has no server, so the key can be seen by anyone using your browser: never put your key in the page's code, and in Google AI Studio restrict it to the website referrer <b>samjades.github.io/*</b> if you plan to share the link.</p></div>`;
 else if(V==='series'){const p=cur();m.innerHTML=`<div class=card><h2>Series planner</h2><p class=mut>Five episode ideas for ${esc(p.character.name)}.</p><button class=pri onclick="series()" ${BUSY?'disabled':''}>${BUSY==='series'?'Planning…':'Plan 5 episodes'}</button></div><div class=grid>${SER.map((e,i)=>`<div class=card><span class=chip>Episode ${i+1}</span><h3>${esc(e.title)}</h3><p>${esc(e.coreIdea)}</p><small>Goal: ${esc(e.educationalObjective)}<br>Activity: ${esc(e.distinctiveActivity)}</small></div>`).join('')}</div>`}
 else proj(m)}
function proj(m){const p=cur(),tabs=[['lyrics','Lyrics & character'],['board','Storyboard'],['preview','Preview & video'],['publish','Publish kit'],['export','Downloads']];let h='';
 if(T==='lyrics')h=`<div class=card><h3>${esc(p.character.name)} <small>${esc(p.character.species)}</small></h3><p>${esc(p.character.look)}</p><small>Consistency prompt</small><code>${esc(p.character.prompt)}</code><button onclick="cp(cur().character.prompt)">Copy</button></div>
 <div class=card><h3>Lyrics</h3>${p.lyrics.map((s,i)=>`<b>${esc(s.label)}</b>${s.lines.map((l,j)=>`<input aria-label="line" value="${esc(l)}" oninput="cur().lyrics[${i}].lines[${j}]=this.value;sv()">`).join('')}`).join('')}</div>
 <div class=card><h3>Music · ${p.music.bpm} BPM</h3><p>${esc(p.music.genre)}</p><small>Prompt for Suno / Udio</small><code>${esc(p.music.prompt)}</code><button onclick="cp(cur().music.prompt)">Copy</button></div>`;
 if(T==='board')h=`<div class=row style="margin-bottom:12px"><button class=pri onclick="genAll()">Generate all frames</button><small>Free AI images; if one fails, the preview uses a drawn scene.</small></div>`+p.scenes.map((s,i)=>`<div class="card scene"><div>${s.img?`<img src="${esc(s.img)}" alt="${esc(s.title)}">`:`<div class=ph>${s.emoji}</div>`}<button style="margin-top:8px;width:100%" onclick="genImg(${i})">${s.img?'Regenerate frame':'Generate frame'}</button></div>
 <div><span class=chip>Scene ${i+1} · ${s.dur}s</span><h3>${esc(s.title)}</h3><label>On-screen caption</label><textarea rows=2 onchange="cur().scenes[${i}].lyrics=this.value;sv()">${esc(s.lyrics)}</textarea><small>${esc(s.visual)}</small><br><small>Video prompt (Runway / Luma / Kling)</small><code>${esc(s.videoPrompt)}</code><button onclick="cp(cur().scenes[${i}].videoPrompt)">Copy prompt</button></div></div>`).join('');
 if(T==='preview')h=`<div class=card><canvas id=cv></canvas><div class=row style="justify-content:center"><button class=pri id=pp onclick="P.playing?stop():play()">▶ Play</button><input id=sk type=range min=0 max=${total(p)} step=.1 value=0 style="width:240px" aria-label="Seek" oninput="P.t=+this.value;P.playing?play():draw(P.t);upd(P.t)"><span id=tm class=mut></span></div></div>
 <div class=card><h3>Render video</h3><p class=mut>Records the preview (picture, captions and music) to a real video file, in real time.</p><button class=pri onclick="exp()">Render &amp; export video</button><p id=xp></p></div>`;
 if(T==='publish'){const u=p.publish||{};h=`<div class=card><h3>Title ideas</h3>${(u.titles||[]).map(t=>`<p>${esc(t)} <button onclick="cp(this.dataset.t)" data-t="${esc(t)}">Copy</button></p>`).join('')}<h3>Description</h3><code>${esc(u.description)}</code><button onclick="cp(cur().publish.description)">Copy</button><h3>Hashtags</h3>${(u.hashtags||[]).map(t=>`<span class=chip>${esc(t)}</span>`).join('')}<h3>Follow-up ideas</h3><ul>${(u.ideas||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`}
 if(T==='export')h=`<div class=card><h3>Downloads</h3><div class=row><button onclick="dlSrt()">Captions (.srt)</button><button onclick="dlTxt()">Lyrics (.txt)</button><button onclick="dl(cur().music.prompt,'music-prompt.txt','text/plain')">Music prompt</button><button onclick="dl(JSON.stringify(cur(),null,2),'project.json','application/json')">Project (.json)</button></div></div>`;
 m.innerHTML=`<div class=card><span class=chip>${esc(p.type)} · ${esc(p.age)}</span><h2>${esc(p.title)}</h2></div><div class=tabs>${tabs.map(t=>`<button class="${T===t[0]?'on':''}" onclick="stop();T='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${h}`;
 if(T==='preview'){const cv=$('#cv'),[w,hh]=DIM[p.ratio];cv.width=w;cv.height=hh;cv.style.maxWidth=p.ratio==='16:9'?'640px':'340px';draw(P.t);upd(P.t)}}
function dlSrt(){const f=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60),z=n=>String(n).padStart(2,'0');return `${z(h)}:${z(m)}:${z(x)},000`};let a=0;
 dl(cur().scenes.map((s,i)=>{const r=`${i+1}\n${f(a)} --> ${f(a+s.dur)}\n${s.lyrics}\n`;a+=s.dur;return r}).join('\n'),'captions.srt','text/plain')}
function dlTxt(){dl(cur().lyrics.map(l=>`[${l.label}]\n${l.lines.join('\n')}`).join('\n\n'),'lyrics.txt','text/plain')}
render();
</script></body></html>
